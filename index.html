<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Product Form</h1>

      <form
        action="https://teach-backend-fawn.vercel.app/api/product"
        method="POST"
        enctype="multipart/form-data"
      >
        <div class="form-group">
          <label for="itemName">Item Name</label>
          <input type="text" id="itemName" name="itemName" required />
        </div>

        <div class="form-group">
          <label for="itemDescription">Item Description</label>
          <textarea
            id="itemDescription"
            name="itemDescription"
            rows="4"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="category">Category</label>

          <select id="category" name="category">
            <option value="notSpecified">Not Specified</option>
            <option value="consumption">Consumption</option>
            <option value="household">Household</option>
            <option value="electronic">Electronic</option>
            <option value="gadget">Gadget</option>
          </select>
        </div>

        <div class="form-group">
          <label for="inventoryAmount">Inventory Amount</label>
          <input
            type="number"
            id="inventoryAmount"
            name="inventoryAmount"
            min="0"
            required
          />
        </div>

        <div class="form-group">
          <label for="listPrice">List Price</label>
          <input
            type="number"
            id="listPrice"
            name="listPrice"
            min="0"
            step="0.01"
            required
          />
        </div>

        <div class="form-group">
          <label>Available Stores</label>

          <div class="options">
            <label>
              <input type="checkbox" name="availableStore[]" value="Bangkok" />
              Bangkok
            </label>

            <label>
              <input type="checkbox" name="availableStore[]" value="Pattaya" />
              Pattaya
            </label>

            <label>
              <input type="checkbox" name="availableStore[]" value="Phuket" />
              Phuket
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Status</label>

          <div class="options">
            <label>
              <input type="radio" name="status" value="Active" checked />
              Active
            </label>

            <label>
              <input type="radio" name="status" value="Inactive" />
              Inactive
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="staffEmail">Staff Email</label>
          <input type="email" id="staffEmail" name="staffEmail" required />
        </div>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
